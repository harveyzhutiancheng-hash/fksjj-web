# CANDIDATE SNIPPET: add ONLY these two exact locations inside the existing
# HTTPS game server after approval and baseline/structure validation.
# Keep the installed status location, /api/, fallback 404, HTTP redirect,
# certificate settings, headers and all other sites unchanged. Do not paste a
# second status location or replace the whole server block with this snippet.
# Fixed mapping: the HMAC canonical operation is /v1/upload or /v1/activate;
# nginx strips only the reviewed /_fkssj-release prefix via this exact URI.
# Effective access/error logging must not contain authentication header values,
# envelopes, request bodies or secrets. Do not dump nginx -T or unrelated sites.
location = /_fkssj-release/v1/upload {
    limit_except POST { deny all; }
    client_max_body_size 16m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:8790/v1/upload;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-FKSSJ-Envelope $http_x_fkssj_envelope;
    proxy_set_header X-FKSSJ-Signature $http_x_fkssj_signature;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
location = /_fkssj-release/v1/activate {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:8790/v1/activate;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-FKSSJ-Envelope $http_x_fkssj_envelope;
    proxy_set_header X-FKSSJ-Signature $http_x_fkssj_signature;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
# The receiver still independently verifies the HMAC, fixed repo/ref/commit,
# nonce/TTL, byte count and digest. Upload 202 is received, not staged/active.
